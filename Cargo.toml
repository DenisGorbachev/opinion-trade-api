[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
homepage = "https://github.com/DenisGorbachev/opinion-trade-api"
repository = "https://github.com/DenisGorbachev/opinion-trade-api"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]

[workspace.metadata.details]
name = "opinion-trade-api"
title = ""
readme = { generate = false }

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "opinion-trade-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "API client for https://opinion.trade/"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[package.metadata.details]
title = ""

[lints]
workspace = true

[dependencies]
derive-new = "0.7.0"
derive_more = { version = "2.1.1", features = ["full"] }
strum = { version = "0.27.2", features = ["derive"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
rkyv = { version = "0.8.16", optional = true }
bon = { version = "3.9.0", features = ["implied-bounds"] }
thiserror = "2.0.18"

[dev-dependencies]
errgonomic = { git = "https://github.com/DenisGorbachev/errgonomic" }
tokio = { version = "1.49.0", features = ["macros", "fs", "net", "rt", "rt-multi-thread"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
